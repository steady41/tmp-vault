<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Vault — reveal secret</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b82f6'/><path d='M16 10a4 4 0 0 0-4 4v2H10a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-2v-2a4 4 0 0 0-4-4zm-2 4a2 2 0 0 1 4 0v2h-4v-2z' fill='white'/></svg>">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2.5A4.5 4.5 0 0 0 7.5 7v2H6a2.5 2.5 0 0 0-2.5 2.5v7A2.5 2.5 0 0 0 6 21h12a2.5 2.5 0 0 0 2.5-2.5v-7A2.5 2.5 0 0 0 18 9h-1.5V7A4.5 4.5 0 0 0 12 2.5zm-2.5 4.5A2.5 2.5 0 0 1 12 4.5a2.5 2.5 0 0 1 2.5 2.5v2h-5V7z"/></svg>
        </span>
        <span><div class="brand-name">VAULT</div><div class="brand-sub">Zero-knowledge</div></span>
      </a>
      <div class="nav-links">
        <span class="badge"><span class="badge-dot"></span> End-to-end encrypted</span>
        <a href="/">Create new</a>
      </div>
    </div>
  </nav>

  <div class="wrap">
    <main class="card" aria-live="polite">
      <h2 id="page-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        Secret
      </h2>
      <p class="sub" id="status">Decrypting…</p>

      <div id="secret-wrap" class="hidden">
        <span class="burn-notice">🔥 This secret was destroyed on the server after reading</span>
        <div id="secret-box" class="reveal-box" role="region" aria-label="Secret content"></div>
        <div style="display:flex; gap:10px; margin-top:14px;">
          <button id="copy" class="btn" type="button" style="flex:1; margin:0;">Copy to clipboard</button>
          <a href="/" class="btn btn-ghost" style="flex:1; margin:0; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">Create new</a>
        </div>
        <p style="text-align:center; color:var(--muted); font-size:0.78rem; margin-top:10px;">The key was stripped from the URL. Reloading will show “destroyed”.</p>
      </div>

      <div id="empty" class="hidden empty-state"></div>
    </main>
  </div>

  <footer class="footer"><p>Vault · zero-knowledge · single-use</p></footer>

  <script src="/static/crypto.js"></script>
  <script src="/static/reveal.js"></script>
</body>
</html>
