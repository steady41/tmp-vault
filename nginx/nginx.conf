# Reference nginx config for the Vault reverse proxy.
#
# Expected layout:
#   ./nginx/certs/fullchain.pem   TLS certificate chain
#   ./nginx/certs/privkey.pem     private key
# Generate test certificates with:
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout nginx/certs/privkey.pem \
#     -out nginx/certs/fullchain.pem \
#     -days 90 -subj "/CN=vault.example.com"
#
# The app expects X-Forwarded-For and VAULT_TRUST_PROXY=true (set in the
# Dockerfile) to resolve the real client IP for rate limiting.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    server_tokens     off;
    keepalive_timeout 65;

    # L7 rate limit: max 10 requests/min/IP against the API.
    limit_req_zone $binary_remote_addr zone=vault_api:10m rate=10r/m;

    upstream vault_app {
        server app:8000;
    }

    # --- Redirect all HTTP to HTTPS -----------------------------------------
    server {
        listen 80;
        server_name vault.example.com;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS server --------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name vault.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # --- Security headers -------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # The client never sends more than a small JSON payload.
        client_max_body_size 100k;

        # --- API: rate limited, then proxied ----------------------------------
        location /api/ {
            limit_req zone=vault_api burst=20 nodelay;
            proxy_pass http://vault_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Static frontend and reveal pages ---------------------------------
        location / {
            proxy_pass http://vault_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
